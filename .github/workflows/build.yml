name: build-libmod
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get ShadowHook
        run: |
          curl -fL -o sh.aar https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/1.0.9/shadowhook-1.0.9.aar
          unzip -q sh.aar -d shaar
          mkdir -p sh
          cp -r shaar/prefab/modules/shadowhook/include sh/include
          cp shaar/prefab/modules/shadowhook/libs/android.arm64-v8a/libshadowhook.so sh/
          ls -R sh | head -20

      - name: Build arm64
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          cmake -S . -B out \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build out -j4 2>&1 | tee build.log
          grep -m5 -B2 -A6 "error" build.log || true
          test -f out/libmod.so
          mkdir -p dist && cp out/libmod.so sh/libshadowhook.so dist/

      - uses: actions/upload-artifact@v4
        with:
          name: libmod
          path: dist/
